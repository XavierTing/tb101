<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Transaction banking operating map — How the bank earns from everyday business money movement</title>
  <desc id="desc">A static transaction banking operating map showing a central bank operating ledger, four satellite cards for collections, connectivity, payments, and cross-border activity, and a legend explaining Float, Fees, FX spread, and Interest.</desc>

  <defs>
    <marker id="arrow-teal" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 5L0 10Z" fill="#1B9C6E"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 5L0 10Z" fill="#2F6BD3"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 5L0 10Z" fill="#C9533A"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 5L0 10Z" fill="#6B6B66"/>
    </marker>

    <style>
      text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      .eyebrow {
        fill: #888780;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
      }
      .main-title {
        fill: #1A1A18;
        font-size: 28px;
        font-weight: 700;
      }
      .center-title {
        fill: #1A1A18;
        font-size: 22px;
        font-weight: 700;
      }
      .center-subtitle {
        fill: #6B6B66;
        font-size: 14px;
        font-weight: 500;
      }
      .card-title {
        fill: #1A1A18;
        font-size: 18px;
        font-weight: 500;
      }
      .subtitle {
        fill: #6B6B66;
        font-size: 14px;
        font-weight: 400;
      }
      .pill-title {
        font-size: 14px;
        font-weight: 700;
      }
      .pill-subtitle {
        fill: #6B6B66;
        font-size: 13px;
        font-weight: 400;
      }
      .caption {
        font-size: 12px;
        font-weight: 600;
      }
      .track-caption {
        fill: #6B6B66;
        font-size: 11px;
        font-weight: 600;
      }
      .tag {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .tag-detail {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0;
      }
      .legend-title {
        fill: #1A1A18;
        font-size: 16px;
        font-weight: 600;
      }
      .legend-subtitle {
        fill: #6B6B66;
        font-size: 12px;
        font-weight: 400;
      }
      .legend-pill {
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#F5F2EA"/>

  <text x="90" y="78" class="eyebrow">TRANSACTION BANKING OPERATING MAP</text>
  <text x="90" y="116" class="main-title">How the bank earns from everyday business money movement</text>

  <path d="M390 330H430" fill="none" stroke="#1B9C6E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M390 510H410V465H430" fill="none" stroke="#2F6BD3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M970 330H1010" fill="none" stroke="#C9533A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-coral)"/>
  <path d="M1010 515H990V455H970" fill="none" stroke="#6B6B66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>

  <g aria-label="Customers pay in card">
    <rect x="90" y="270" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#E5E0D3"/>
    <rect x="116" y="300" width="44" height="44" rx="10" fill="#E8F5F1"/>
    <path d="M131 314V334M145 314V334M125 321H152M125 330H152" fill="none" stroke="#1B9C6E" stroke-width="2.6" stroke-linecap="round"/>
    <text x="176" y="318" class="card-title">Customers pay in</text>
    <text x="176" y="346" class="subtitle">QR, card, virtual accounts</text>
    <text x="116" y="370">
      <tspan class="tag" fill="#0F7653">COLLECTIONS</tspan>
      <tspan class="tag-detail" fill="#0F7653" dx="8">— merchant + VA fees</tspan>
    </text>
  </g>

  <g aria-label="ERP and channels card">
    <rect x="90" y="450" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#E5E0D3"/>
    <rect x="116" y="480" width="44" height="44" rx="10" fill="#EAF0FB"/>
    <path d="M134 497H146M134 506H146M134 515H142" fill="none" stroke="#2F6BD3" stroke-width="2.6" stroke-linecap="round"/>
    <text x="176" y="498" class="card-title">ERP and channels</text>
    <text x="176" y="526" class="subtitle">Portal, app, H2H, APIs</text>
    <text x="116" y="550">
      <tspan class="tag" fill="#1F4F9F">CONNECTIVITY</tspan>
      <tspan class="tag-detail" fill="#1F4F9F" dx="8">— channel fees</tspan>
    </text>
  </g>

  <g aria-label="Suppliers get paid card">
    <rect x="1010" y="270" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#E5E0D3"/>
    <rect x="1036" y="300" width="44" height="44" rx="10" fill="#FAEEEB"/>
    <path d="M1048 322H1071M1060 311L1072 322L1060 333" fill="none" stroke="#C9533A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1096" y="318" class="card-title">Suppliers get paid</text>
    <text x="1096" y="346" class="subtitle">FAST, GIRO, MEPS, wires</text>
    <text x="1036" y="370">
      <tspan class="tag" fill="#A13E2C">PAYMENTS</tspan>
      <tspan class="tag-detail" fill="#A13E2C" dx="8">— rail fees</tspan>
    </text>
  </g>

  <g aria-label="Trade and FX card">
    <rect x="1010" y="450" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#E5E0D3"/>
    <rect x="1036" y="480" width="44" height="44" rx="10" fill="#EFEDF8"/>
    <circle cx="1058" cy="502" r="15" fill="none" stroke="#5B4FB8" stroke-width="2.3"/>
    <path d="M1044 502H1072M1058 487C1052 494 1052 510 1058 517M1058 487C1064 494 1064 510 1058 517" fill="none" stroke="#5B4FB8" stroke-width="2.3" stroke-linecap="round"/>
    <text x="1096" y="498" class="card-title">Trade and FX</text>
    <text x="1096" y="526" class="subtitle">Shipments, guarantees, hedges</text>
    <text x="1036" y="550">
      <tspan class="tag" fill="#433795">CROSS-BORDER</tspan>
      <tspan class="tag-detail" fill="#4B4B47" dx="8">— FX spread + interest</tspan>
    </text>
  </g>

  <g aria-label="Bank operating ledger">
    <rect x="430" y="180" width="540" height="404" rx="16" fill="#FFFFFF" stroke="#E5E0D3"/>
    <path d="M430 244H970" stroke="#E5E0D3"/>
    <text x="464" y="220" class="center-title">Bank operating ledger</text>
    <text x="740" y="220" class="center-subtitle">Accounts, rails, controls</text>

    <rect x="464" y="272" width="140" height="58" rx="10" fill="#EAF0FB"/>
    <text x="484" y="297" class="pill-title" fill="#1F4F9F">Accounts</text>
    <text x="484" y="319" class="pill-subtitle">Where cash sits</text>

    <rect x="632" y="272" width="140" height="58" rx="10" fill="#FAEEEB"/>
    <text x="652" y="297" class="pill-title" fill="#A13E2C">Payments</text>
    <text x="652" y="319" class="pill-subtitle">Money out</text>

    <rect x="800" y="272" width="136" height="58" rx="10" fill="#E8F5F1"/>
    <text x="820" y="297" class="pill-title" fill="#0F7653">Collect</text>
    <text x="820" y="319" class="pill-subtitle">Money in</text>

    <rect x="464" y="356" width="226" height="150" rx="16" fill="#FFFFFF" stroke="#E5E0D3"/>
    <text x="488" y="390" class="card-title">Treasury view</text>
    <text x="488" y="419" class="subtitle">Balances across currencies</text>
    <rect x="488" y="442" width="52" height="32" rx="8" fill="#FFFFFF" stroke="#E5E0D3"/>
    <text x="507" y="463" class="caption" fill="#1A1A18">SGD</text>
    <rect x="552" y="442" width="54" height="32" rx="8" fill="#FFFFFF" stroke="#E5E0D3"/>
    <text x="571" y="463" class="caption" fill="#1A1A18">USD</text>
    <rect x="618" y="442" width="50" height="32" rx="8" fill="#FFFFFF" stroke="#E5E0D3"/>
    <text x="638" y="463" class="caption" fill="#1A1A18">JPY</text>
    <rect x="488" y="489" width="178" height="8" rx="4" fill="#E5E0D3"/>
    <rect x="488" y="489" width="122" height="8" rx="4" fill="#1B9C6E"/>

    <rect x="710" y="356" width="226" height="150" rx="16" fill="#FFFFFF" stroke="#E5E0D3"/>
    <text x="734" y="390" class="card-title">Control layer</text>
    <text x="734" y="419" class="subtitle">Approvals, APIs, files</text>
    <circle cx="760" cy="461" r="13" fill="#FFFFFF" stroke="#2F6BD3" stroke-width="2.4"/>
    <path d="M753 461H767M760 454V468" stroke="#2F6BD3" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="823" cy="461" r="13" fill="#FFFFFF" stroke="#1B9C6E" stroke-width="2.4"/>
    <path d="M816 460L822 466L831 455" fill="none" stroke="#1B9C6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="886" cy="461" r="13" fill="#FFFFFF" stroke="#C9533A" stroke-width="2.4"/>
    <path d="M879 461H893" stroke="#C9533A" stroke-width="2.4" stroke-linecap="round"/>

    <rect x="490" y="518" width="176" height="28" rx="10" fill="#EAF0FB"/>
    <circle cx="510" cy="532" r="5" fill="#2F6BD3"/>
    <text x="524" y="536" class="caption" fill="#1F4F9F">balances create float</text>

    <rect x="734" y="518" width="180" height="28" rx="10" fill="#FAEEEB"/>
    <circle cx="754" cy="532" r="5" fill="#C9533A"/>
    <text x="768" y="536" class="caption" fill="#A13E2C">setup, file, API fees</text>

    <path d="M464 562H936" stroke="#E5E0D3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="464" cy="562" r="4.5" fill="#2F6BD3"/>
    <circle cx="621" cy="562" r="4.5" fill="#C9533A"/>
    <circle cx="778" cy="562" r="4.5" fill="#1B9C6E"/>
    <circle cx="936" cy="562" r="4.5" fill="#6B6B66"/>
    <text x="464" y="578" class="track-caption">value concentrates in operating balances and transaction volume</text>
  </g>

  <g aria-label="How the bank earns legend">
    <rect x="90" y="635" width="1220" height="86" rx="16" fill="#FFFFFF" stroke="#E5E0D3"/>
    <text x="122" y="669" class="legend-title">How the bank earns</text>
    <text x="122" y="695" class="legend-subtitle">sits / moves / converts / finances</text>

    <rect x="420" y="657" width="130" height="40" rx="10" fill="#EAF0FB"/>
    <circle cx="444" cy="677" r="5" fill="#2F6BD3"/>
    <text x="464" y="682" class="legend-pill" fill="#1F4F9F">Float</text>

    <rect x="600" y="657" width="130" height="40" rx="10" fill="#FAEEEB"/>
    <circle cx="624" cy="677" r="5" fill="#C9533A"/>
    <text x="644" y="682" class="legend-pill" fill="#A13E2C">Fees</text>

    <rect x="780" y="657" width="160" height="40" rx="10" fill="#E8F5F1"/>
    <circle cx="804" cy="677" r="5" fill="#1B9C6E"/>
    <text x="824" y="682" class="legend-pill" fill="#0F7653">FX spread</text>

    <rect x="990" y="657" width="150" height="40" rx="10" fill="#F0F0EF"/>
    <circle cx="1014" cy="677" r="5" fill="#6B6B66"/>
    <text x="1034" y="682" class="legend-pill" fill="#4B4B47">Interest</text>
  </g>
</svg>
